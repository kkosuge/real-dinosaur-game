<!doctype html>
<!-- OGP card (1200x630): a frozen game frame (frame.png, see tools/ogp/build.sh) with the title on top. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #cfd5de; }
  .card { position: relative; width: 1200px; height: 630px; background: url(frame.png) no-repeat 0 0 / 1200px 630px; }
  h1 {
    position: absolute; left: 0; right: 0; top: 78px; margin: 0; text-align: center;
    font: bold 76px "Courier New", Courier, monospace; letter-spacing: 2px; color: #535353;
    text-shadow: 0 0 18px rgba(240, 242, 245, .9);
  }
  p {
    position: absolute; left: 0; right: 0; top: 170px; margin: 0; text-align: center;
    font: bold 26px "Courier New", Courier, monospace; color: #6b6b6b;
    text-shadow: 0 0 12px rgba(240, 242, 245, .9);
  }
</style>
<div class="card">
  <h1>REAL DINOSAUR GAME</h1>
  <p>The Chrome T-Rex runner, photorealistic</p>
</div>
